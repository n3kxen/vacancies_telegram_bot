services:
  bot:
    build: .
    restart: unless-stopped      # auto-restart on crash or server reboot
    env_file: .env               # load secrets from .env file
    volumes:
      - ./data:/app/data        # persist vacancies.json and seen.json outside the container
    ports:
      - "8000:8000"             # expose metrics

  prometheus:
    image: prom/prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
